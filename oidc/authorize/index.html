<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Authorize · Mock OIDC Provider</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  code { background: color-mix(in srgb, currentColor 10%, transparent); padding: .1rem .3rem; border-radius: 4px; }
  textarea { width: 100%; min-height: 12rem; font: inherit; padding: .5rem; box-sizing: border-box; }
  .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .muted { opacity: .7; }
  .row { margin: .3rem 0; }
  button, .btn { font: inherit; padding: .4rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; cursor: pointer; text-decoration: none; color: inherit; }
  .err { color: #c0392b; }
</style>
</head>
<body>
<h1>Mock OIDC Provider — authorization</h1>
<div id="app" class="muted">Working…</div>
<script type="module">
import {
  importPrivateJwk, signJwt, unb64url,
  buildIdTokenPayload, buildAccessTokenPayload,
  normalizeScope, userFromParams, loadJson,
} from "../oidc.js";

const el = document.getElementById("app");
const params = new URL(location.href).searchParams;

function fail(message) {
  el.className = "";
  el.innerHTML = `<p class="err">${message}</p>
    <p class="muted">This is a static mock OIDC provider. It only supports the OAuth 2.0
    <strong>implicit flow</strong> (<code>response_type=id_token</code> or <code>id_token token</code>).
    The authorization-code flow needs a back-channel token endpoint, which a static
    host cannot provide.</p>`;
}

try {
  const config = await loadJson(new URL("../config.json", import.meta.url));
  const key = await loadJson(new URL("../key.json", import.meta.url));

  const issuer = params.get("issuer") || config.issuer;
  const clientId = params.get("client_id") || config.defaultClientId;
  const redirectUri = params.get("redirect_uri") || "";
  const responseType = (params.get("response_type") || "id_token").split(/\s+/).filter(Boolean);
  const scope = normalizeScope(params.get("scope"));
  const state = params.get("state");
  const nonce = params.get("nonce");
  const responseMode = params.get("response_mode") || "fragment";
  const debug = params.has("debug");
  const ttl = Number(config.idTokenTtl) || 3600;

  if (responseType.includes("code") && !responseType.includes("id_token") && !responseType.includes("token")) {
    fail("response_type=code is not supported by this static mock. Use response_type=id_token or id_token token.");
    throw new Error("handled");
  }
  if (!responseType.includes("id_token") && !responseType.includes("token")) {
    fail(`Unsupported response_type: ${responseType.join(" ") || "(none)"}`);
    throw new Error("handled");
  }
  if (!scope.includes("openid")) {
    fail("The openid scope is required.");
    throw new Error("handled");
  }

  const user = userFromParams(params);
  const privateKey = await importPrivateJwk(key.privateJwk);
  const idToken = await signJwt(
    buildIdTokenPayload({ issuer, clientId, user, scope, nonce, ttlSeconds: ttl }),
    privateKey,
    key.kid
  );
  const accessToken = responseType.includes("token")
    ? await signJwt(buildAccessTokenPayload({ issuer, clientId, user, scope, ttlSeconds: ttl }), privateKey, key.kid)
    : null;

  const out = { id_token: idToken };
  if (accessToken) {
    out.access_token = accessToken;
    out.token_type = "Bearer";
    out.expires_in = String(ttl);
  }
  if (state) out.state = state;

  if (redirectUri && !debug) {
    const base = redirectUri.split("#")[0];
    if (responseMode === "form_post") {
      const form = document.createElement("form");
      form.method = "post";
      form.action = base;
      for (const [k, v] of Object.entries(out)) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = k;
        input.value = v;
        form.appendChild(input);
      }
      document.body.appendChild(form);
      el.textContent = "Signing you in…";
      form.submit();
    } else if (responseMode === "query") {
      const u = new URL(base);
      for (const [k, v] of Object.entries(out)) u.searchParams.set(k, v);
      el.textContent = "Signing you in…";
      location.replace(u.toString());
    } else {
      const frag = new URLSearchParams(out).toString();
      el.textContent = "Signing you in…";
      location.replace(`${base}#${frag}`);
    }
    throw new Error("handled");
  }

  // No redirect (or ?debug): show the tokens.
  el.className = "";
  const data = JSON.parse(unb64url(out.id_token.split(".")[1]));
  const manual = redirectUri
    ? `<p><a class="btn" href="${redirectUri.split("#")[0]}#${new URLSearchParams(out).toString()}">Continue to redirect_uri</a></p>`
    : `<p class="muted">No <code>redirect_uri</code> given, so the tokens are shown here instead of being redirected.</p>`;
  el.innerHTML = `
    <div class="card">
      <div class="row"><span class="muted">issuer</span> <code>${issuer}</code></div>
      <div class="row"><span class="muted">client_id</span> <code>${clientId}</code></div>
      <div class="row"><span class="muted">sub</span> <code>${data.sub}</code></div>
      <div class="row"><span class="muted">nonce</span> <code>${data.nonce ?? "(none)"}</code></div>
    </div>
    ${manual}
    <h3>id_token</h3>
    <textarea readonly>${out.id_token}</textarea>
    <h3>Decoded id_token claims</h3>
    <textarea readonly>${JSON.stringify(data, null, 2)}</textarea>
    ${accessToken ? `<h3>access_token (JWT)</h3><textarea readonly>${accessToken}</textarea>` : ""}
  `;
} catch (err) {
  if (err.message !== "handled") fail(String(err.message || err));
}
</script>
</body>
</html>

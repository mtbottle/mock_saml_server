name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Compute Pages URL
        id: pages_url
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            base="https://${{ github.repository_owner }}.github.io/"
          else
            base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Generate static metadata + certificate
        env:
          SSO_URL: ${{ steps.pages_url.outputs.base }}
          IDP_ENTITY_ID: ${{ steps.pages_url.outputs.base }}
        run: npm run gen:metadata

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html app.js saml.js styles.css vendor.js \
             idp-key.json idp-cert.pem metadata.xml .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
